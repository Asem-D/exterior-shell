[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exterior-shell"
version = "2.0.0"
description = "Extract lightweight exterior shells from BIM models (IFC). Stripped IFC + GeoJSON footprint + 3D Tiles (glTF) export + optional AI classification for GIS and web visualization."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Asem Daaboul", email = "asem.daaboul@gmail.com" },
]
keywords = ["bim", "ifc", "gis", "exterior-shell", "building-envelope", "ifcopenshell", "footprint", "3d-tiles", "gltf", "cesium"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "ifcopenshell>=0.7.0",
    "shapely>=2.0",
    "numpy>=1.24",
    "click>=8.0",
]

[project.urls]
Homepage = "https://github.com/Asem-D/exterior-shell"
Repository = "https://github.com/Asem-D/exterior-shell"
Issues = "https://github.com/Asem-D/exterior-shell/issues"

[project.optional-dependencies]
ai = [
    "openai>=1.0",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
exterior-shell = "exterior_shell.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["exterior_shell"]

[tool.hatch.build.targets.sdist]
exclude = ["tests/", "linkedin-diagram*", "_gen_screenshot.py", "_take_screenshot.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
